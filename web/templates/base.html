<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default('讲书工作流') }} · Web 工作台</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="v0-layout">
    <aside class="v0-sidebar" aria-label="主导航">
        <a href="/" class="v0-sidebar-brand" style="text-decoration:none;">
            <div class="v0-sidebar-logo">讲</div>
            <div>
                <div class="v0-sidebar-name">讲书升级Agent</div>
                <div class="v0-sidebar-desc">内容增长 Agent</div>
            </div>
        </a>

        <nav class="v0-nav">
            <a href="/" class="v0-nav-item">
                <span class="v0-nav-icon">⌂</span>
                <span>项目</span>
            </a>
            <a href="/work" class="v0-nav-item">
                <span class="v0-nav-icon">⚡</span>
                <span>Agent 工作台</span>
            </a>
            <a href="/dashboard" class="v0-nav-item">
                <span class="v0-nav-icon">📈</span>
                <span>数据分析</span>
            </a>
            <a href="/growth" class="v0-nav-item">
                <span class="v0-nav-icon">🧠</span>
                <span>Agent学习</span>
            </a>
            <a href="/feedback" class="v0-nav-item">
                <span class="v0-nav-icon">💬</span>
                <span>反馈中心</span>
            </a>
        </nav>

        <div class="v0-sidebar-user">
            <div class="v0-sidebar-user-inner">
                <div class="v0-avatar">B</div>
                <div style="line-height:1.25;">
                    <div class="v0-user-name">Content Growth</div>
                    <div class="v0-user-plan">Agent v2</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="v0-main">
        <div class="v0-container">
            {% if content %}
{{ content | safe }}
{% else %}
{% block content %}{% endblock %}
{% endif %}
        </div>
    </main>
</div>
<script src="/static/app.js?v=20260629.08"></script>
</body>
</html>
