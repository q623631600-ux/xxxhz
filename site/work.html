<!-- 讲稿预览弹窗 -->
<dialog id="script-dialog" style="border:none;border-radius:16px;padding:2rem;min-width:500px;max-width:800px;width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.15);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 id="script-dialog-title" style="margin:0;font-size:1.1rem;">讲稿预览</h3>
        <button type="button" onclick="this.closest('dialog').close()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">X</button>
    </div>
    <div id="script-dialog-body" style="max-height:70vh;overflow-y:auto;padding:1rem;background:var(--bg);border-radius:8px;white-space:pre-wrap;font-size:14px;line-height:1.8;"></div>
    <div style="display:flex;justify-content:flex-end;gap:0.8rem;margin-top:1.5rem;">
        <button type="button" onclick="this.closest('dialog').close()" style="background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:0.5rem 1.2rem;border-radius:8px;cursor:pointer;">关闭</button>
    </div>
</dialog>

<script>
// 讲稿预览（全屏弹窗）
function viewScriptPreview(bookName, topicId) {
    if (!bookName && !topicId) {
        var up = new URLSearchParams(window.location.search);
        bookName = (typeof _safeDecodeURI !== 'undefined') ? _safeDecodeURI(up.get('book')||'') : (up.get('book')||'');
        topicId = (parseInt(up.get('kp_id')||'0')) - 100;
    }
    var raw = (typeof _safeDecodeURI !== 'undefined') ? _safeDecodeURI(bookName) : bookName;
    fetch('/api/agent/draft-script?book_name='+encodeURIComponent(raw)+'&topic_id='+topicId).then(function(r){return r.json();}).then(function(j){
        if(!j.success){alert('加载失败');return;}
        var d=j.data;
        document.getElementById('script-dialog-title').textContent = '讲稿预览 ('+d.script_words+'字)';
        document.getElementById('script-dialog-body').textContent = d.full_script || '(空)';
        document.getElementById('script-dialog').showModal();
    }).catch(function(e){alert('加载失败: '+e.message);});
}

// 页面加载时自动加载讲稿内容到预览区
function loadScriptPreview() {
    var body = document.getElementById('script-preview-body');
    var meta = document.getElementById('script-preview-meta');
    if (!body || !meta) return;
    // 从 URL 实时获取参数，避免模板变量编码问题
    var urlParams = new URLSearchParams(window.location.search);
    var raw = (typeof _safeDecodeURI !== 'undefined') ? _safeDecodeURI(urlParams.get('book') || '') : (urlParams.get('book') || '');
    var kpId = parseInt(urlParams.get('kp_id') || '0');
    if (!raw || !kpId || kpId < 100) { body.textContent = '讲稿预览不可用'; return; }
    var topicId = kpId - 100;
    var scriptTimeout = setTimeout(function() {
        if (body && body.textContent === '加载中...') {
            body.textContent = '加载超时，请点「全屏查看」按钮查看';
            meta.textContent = '超时';
        }
    }, 5000);
    fetch('/api/agent/draft-script?book_name='+encodeURIComponent(raw)+'&topic_id='+topicId)
        .then(function(r){return r.json()})
        .then(function(j){
            clearTimeout(scriptTimeout);
            if (!j.success) { body.textContent = '讲稿尚未生成'; meta.textContent = '无'; return; }
            var d = j.data;
            meta.textContent = d.script_words + '字' + (d.quality_check ? ' · 已审核' : '');
            body.textContent = d.full_script || '(空)';
        })
        .catch(function(){
            clearTimeout(scriptTimeout);
            body.textContent = '讲稿尚未生成';
            meta.textContent = '无';
        });
}

// 立即执行讲稿预览加载
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadScriptPreview);
} else {
    loadScriptPreview();
}
</script>
